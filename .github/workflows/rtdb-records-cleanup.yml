name: One-time RTDB Records Cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cleanup-records:
    if: contains(github.event.head_commit.message, '[cleanup-rtdb-records]')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Remove only RTDB records node
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_ROOT: starcraftTier/current
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          node <<'NODE'
          const admin = require("firebase-admin");

          const databaseURL =
            process.env.FIREBASE_DATABASE_URL ||
            "https://jddcontens-default-rtdb.asia-southeast1.firebasedatabase.app";
          const rootPath = process.env.FIREBASE_ROOT || "starcraftTier/current";
          const rawJson = process.env.FIREBASE_SERVICE_ACCOUNT_JSON;

          if (!rawJson) throw new Error("FIREBASE_SERVICE_ACCOUNT_JSON is missing");
          const serviceAccount = JSON.parse(rawJson);
          if (serviceAccount.private_key) {
            serviceAccount.private_key = serviceAccount.private_key.replace(/\\n/g, "\n");
          }

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            databaseURL,
          });

          async function shallowCount() {
            const url =
              databaseURL.replace(/\/+$/, "") +
              "/" +
              rootPath.replace(/^\/+|\/+$/g, "") +
              "/records.json?shallow=true";
            const response = await fetch(url, { cache: "no-store" });
            if (!response.ok) throw new Error("shallow read failed: " + response.status);
            const value = await response.json();
            return value && typeof value === "object" ? Object.keys(value).length : 0;
          }

          (async () => {
            const db = admin.database();
            const rootRef = db.ref(rootPath);
            const recordsRef = rootRef.child("records");
            const beforeCount = await shallowCount();

            console.log("Before records key count:", beforeCount);
            await recordsRef.remove();

            const afterSnap = await recordsRef.once("value");
            if (afterSnap.exists()) {
              throw new Error("records node still exists after remove()");
            }

            const [playersSnap, recordMetaSnap, liveStatusSnap, winRatesSnap] = await Promise.all([
              rootRef.child("players").limitToFirst(1).once("value"),
              rootRef.child("recordMeta").limitToFirst(1).once("value"),
              rootRef.child("liveStatus").limitToFirst(1).once("value"),
              rootRef.child("winRates").limitToFirst(1).once("value"),
            ]);

            console.log("After records key count: 0");
            console.log("Preserved nodes:", {
              players: playersSnap.exists(),
              recordMeta: recordMetaSnap.exists(),
              liveStatus: liveStatusSnap.exists(),
              winRates: winRatesSnap.exists(),
            });
          })()
            .finally(() => admin.app().delete().catch(() => {}));
          NODE
